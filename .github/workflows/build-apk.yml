name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bước này tự generate gradlew đúng chuẩn, không cần file trong repo
      - name: Setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Dùng 'gradle' (CLI được setup bởi action ở trên), KHÔNG dùng ./gradlew
      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Release APK
        run: gradle :app:assembleRelease

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release*.apk
          body: |
            ## Cai dat
            1. Tai APK ben duoi ve dien thoai
            2. Mo APK de cai (bat "Cai tu nguon khong ro")
            3. Mo app > Bat dau giam sat
            4. Nhan "Tat toi uu pin" de on dinh tren ColorOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
