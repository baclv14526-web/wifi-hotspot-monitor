name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Gradle đúng chuẩn (không cần gradlew hay jar trong repo)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # 4. Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Build Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 6. Build Release APK (unsigned - dùng debug keystore)
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      # 7. Upload Debug APK artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiHotspotMonitor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 8. Upload Release APK artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiHotspotMonitor-release
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      # 9. Tạo GitHub Release tự động khi push tag vX.X.X
      - name: Get APK info
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_info
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "debug_apk=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          echo "release_apk=$(ls app/build/outputs/apk/release/app-release*.apk)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_info.outputs.tag }}
          name: "WiFi Hotspot Monitor ${{ steps.apk_info.outputs.tag }}"
          body: |
            ## 📲 Cài đặt

            1. Tải file **APK** bên dưới về điện thoại Oppo/Realme
            2. Mở file APK để cài đặt (cần bật "Cài từ nguồn không rõ")
            3. Mở app → nhấn **"Bắt đầu giám sát"**
            4. Vào phần **"Tắt tối ưu pin"** để app chạy ổn định trên ColorOS

            ## 📋 Yêu cầu
            - Android 9.0 (Pie) trở lên
            - Oppo / Realme (ColorOS) được hỗ trợ tốt nhất

            ## 🔧 Tính năng
            - Kiểm tra Hotspot theo chu kỳ (1–60 phút)
            - Gửi thông báo ngay khi Hotspot bị tắt
            - Nút tắt nhanh vào cài đặt Hotspot
            - Tự khởi động sau khi reboot
          files: |
            ${{ steps.apk_info.outputs.debug_apk }}
            ${{ steps.apk_info.outputs.release_apk }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
