name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          gradle assembleDebug 2>&1 | tee build.log || {
            echo "====== KOTLIN ERRORS ======"
            grep -E "^e:|error:|\.kt:[0-9]" build.log || grep -A3 "Compilation error" build.log
            exit 1
          }

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiHotspotMonitor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiHotspotMonitor-release
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Get APK info
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_info
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "debug_apk=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          echo "release_apk=$(ls app/build/outputs/apk/release/app-release*.apk)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_info.outputs.tag }}
          name: "WiFi Hotspot Monitor ${{ steps.apk_info.outputs.tag }}"
          body: |
            ## 📲 Cài đặt
            1. Tải APK bên dưới về điện thoại
            2. Mở APK để cài (cần bật "Cài từ nguồn không rõ")
            3. Mở app → nhấn "Bắt đầu giám sát"
            4. Nhấn "Tắt tối ưu pin" để app ổn định trên ColorOS
          files: |
            ${{ steps.apk_info.outputs.debug_apk }}
            ${{ steps.apk_info.outputs.release_apk }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
