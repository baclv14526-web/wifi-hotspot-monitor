name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Cần fetch toàn bộ history để bump version và commit lại
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Tự động tăng VERSION_PATCH lên 1 mỗi lần build
      - name: Bump version patch
        id: version
        run: |
          # Đọc version hiện tại
          MAJOR=$(grep VERSION_MAJOR version.properties | cut -d= -f2)
          MINOR=$(grep VERSION_MINOR version.properties | cut -d= -f2)
          PATCH=$(grep VERSION_PATCH version.properties | cut -d= -f2)

          # Tăng PATCH
          NEW_PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          # Ghi lại version.properties
          echo "VERSION_MAJOR=${MAJOR}" > version.properties
          echo "VERSION_MINOR=${MINOR}" >> version.properties
          echo "VERSION_PATCH=${NEW_PATCH}" >> version.properties

          # Xuất ra output cho các bước sau
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_name=wifi-monitor-${VERSION}-release.apk" >> $GITHUB_OUTPUT
          echo "✅ Version bumped: ${MAJOR}.${MINOR}.${PATCH} → ${VERSION}"

      # Commit version.properties đã tăng lên repo
      - name: Commit bumped version
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Release APK
        run: gradle :app:assembleRelease

      - name: Show APK name
        run: |
          echo "📦 APK files:"
          find app/build/outputs/apk -name "*.apk" | sort

      # Upload artifact với tên file đúng
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: app/build/outputs/apk/release/wifi-monitor-*-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-monitor-${{ steps.version.outputs.version }}-debug
          path: app/build/outputs/apk/debug/wifi-monitor-*-debug.apk
          retention-days: 7

      # Tạo GitHub Release khi push tag v*
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "WiFi Hotspot Monitor v${{ steps.version.outputs.version }}"
          files: |
            app/build/outputs/apk/release/wifi-monitor-*-release.apk
            app/build/outputs/apk/debug/wifi-monitor-*-debug.apk
          body: |
            ## 📲 Cài đặt
            1. Tải file `wifi-monitor-${{ steps.version.outputs.version }}-release.apk` bên dưới
            2. Mở APK để cài (bật "Cài từ nguồn không rõ")
            3. Mở app → Bắt đầu giám sát
            4. Nhấn "Tắt tối ưu pin" để ổn định trên Oppo/Realme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
