plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Đọc version từ version.properties
def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}

def verMajor = versionProps.getProperty('VERSION_MAJOR', '1').toInteger()
def verMinor = versionProps.getProperty('VERSION_MINOR', '0').toInteger()
def verPatch = versionProps.getProperty('VERSION_PATCH', '0').toInteger()
def verName  = "${verMajor}.${verMinor}.${verPatch}"
// versionCode dùng run number từ env CI, fallback về 1 khi build local
def verCode  = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.wifimonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.wifimonitor"
        minSdk 28
        targetSdk 34
        versionCode verCode
        versionName verName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    // Đặt tên file APK output: wifi-monitor-1.0.0-release.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def type = variant.buildType.name  // "debug" hoặc "release"
            outputFileName = "wifi-monitor-${verName}-${type}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
